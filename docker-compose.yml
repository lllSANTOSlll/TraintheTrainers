version: "3.9"

# ─────────────────────────────────────────────────────────
# Former les Formateurs — Docker Compose
#
# Usage:
#   1. cp .env.docker .env   (fill in secrets)
#   2. docker compose up -d --build
#   3. Open http://localhost   (or http://<server-ip>)
#
# Default login: admin / admin123
# ─────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: train-the-trainers
    restart: unless-stopped

    # Map host port 80 → container port 5000
    # Change "80:5000" to e.g. "8080:5000" if port 80 is already taken
    ports:
      - "80:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000
      DB_PATH: /app/database/trainers.db
      BACKUP_DIR: /app/backups

    volumes:
      # SQLite database — CRITICAL: all app data lives here
      - db_data:/app/database

      # Automatic daily database backups (02:35 AM)
      - backups_data:/app/backups

      # Checklist file uploads
      - uploads_data:/app/uploads

      # Employee photos, attachments, station images
      - public_uploads_data:/app/public/uploads

      # Checklist / Word templates
      - templates_data:/app/templates

    # Extra protection: drop Linux capabilities not needed by Node.js
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# Named volumes — Docker manages these on the host.
# To back up: docker run --rm -v train-the-trainers_db_data:/data -v $(pwd):/backup alpine tar czf /backup/db_backup.tar.gz /data
volumes:
  db_data:
    name: train-the-trainers_db_data
  backups_data:
    name: train-the-trainers_backups_data
  uploads_data:
    name: train-the-trainers_uploads_data
  public_uploads_data:
    name: train-the-trainers_public_uploads_data
  templates_data:
    name: train-the-trainers_templates_data
